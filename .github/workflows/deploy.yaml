name: 🚀 Deploy to Control-plane and EKS

on:
  push:
    branches:
      - siva-demo

env:
  UP_API_TOKEN: ${{ secrets.UP_API_TOKEN }}
  UP_ORG: ${{ secrets.UP_ORG }}
  # EKS cluster kubeconfig - store your kubeconfig content as a GitHub secret
  EKS_KUBECONFIG: ${{ secrets.EKS_KUBECONFIG }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit auto-generated Kustomize files
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: 🔐 Install and login with Upbound
        if: env.UP_API_TOKEN != '' && env.UP_ORG != ''
        uses: upbound/action-up@v1
        with:
          api-token: ${{ secrets.UP_API_TOKEN }}
          organization: ${{ secrets.UP_ORG }}

      - name: 🔍 Detect changed paths
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            integrated-gas:
              - 'state/solution-idp-non-prod/frontend/30-claims/integrated-gas/production/**'
            renewables:
              - 'state/solution-idp-non-prod/frontend/30-claims/renewables/production/**'
            mv:
              - 'state/solution-idp-non-prod/frontend/30-claims/multiverse/production/**'

      # ============================================
      # ☁️ Upbound Control Plane Deployments
      # ============================================

      # Hard coded for demo-purpose. Deploy to integrated-gas-production.
      - name: ⛽ Deploy Integrated Gas (Production)
        if: steps.changes.outputs.integrated-gas == 'true'
        run: |
          up ctx upbound-demo/upbound-gcp-eu-west-3/integrated-gas/production
          kubectl apply -f state/solution-idp-non-prod/frontend/30-claims/integrated-gas/production/

      # Hard coded for demo-purpose. Deploy to Renewable-energy-production.
      - name: 🌱 Deploy Renewable Energy (Production)
        if: steps.changes.outputs.renewables == 'true'
        run: |
          up ctx upbound-demo/upbound-gcp-eu-west-3/renewables/production
          kubectl apply -f state/solution-idp-non-prod/frontend/30-claims/renewables/production/
