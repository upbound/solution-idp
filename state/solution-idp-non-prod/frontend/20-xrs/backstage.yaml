apiVersion: sa.upbound.io/v1alpha1
kind: XBackstage
metadata:
  name: solution-idp
spec:
  parameters:
    id: "solution-idp-non-prod-frontend"
    region: "eu-west-1"
    providerConfigName: "default"
    ingress:
      enabled: true
      host: "backstage.upboundrocks.cloud"
      clusterIssuer: "letsencrypt-prod"
      className: "nginx"
    replicas: 3
    image:
      registry: xpkg.upbound.io
      repository: upbound/backstage
      tag: v0.7.0
    config:
      app:
        title: "solution-idp"
      organization:
        name: "upbound"
      integrations:
        github:
          - host: github.com
            token: '${GITHUB_TOKEN}'
      kubernetes:
        frontend:
          podDelete:
            enabled: true
        skipMetricsLookup: true
        serviceLocatorMethod:
          type: "multiTenant"
        auth:
          providers:
            upbound: {}
        clusterLocatorMethods:
          - type: "config"
            clusters:
              - url: "https://upbound-gcp-eu-west-3.spaces.upbound.io/apis/spaces.upbound.io/v1beta1/namespaces/solution-idp-non-prod-frontend/controlplanes/frontend/k8s"
                name: "solution-idp-non-prod-frontend-frontend"
                authProvider: "upbound"
                skipMetricsLookup: true
                skipTLSVerify: true
                authMetadata:
                  'upbound.io/organization': "upbound-demo"
                  'upbound.io/token': '${UP_ROBOT_TOKEN}'
                gitFilePathPattern: "state/solution-idp-non-prod/frontend/30-claims/$$Kind-$$Namespace-$$Name"
        objectTypes:
          - configmaps
          - deployments
          - pods
          - services
      kubernetesIngestor:
        mappings:
          systemModel: "cluster-namespace"
        components:
          customWorkloadTypes:
            - group: "aws.platform.upbound.io"
              apiVersion: "v1alpha1"
              plural: "xeks"
              singular: "xeks"
            - group: "aws.platform.upbound.io"
              apiVersion: "v1alpha1"
              singular: "xnetwork"
              plural: "xnetworks"
            - group: "aws.platform.upbound.io"
              apiVersion: "v1alpha1"
              plural: "xpodidentities"
              singular: "xpodidentity"
            - group: "platform.upbound.io"
              apiVersion: "v1alpha1"
              plural: "xsqlinstances"
              singular: "XSQLInstance"
            - group: "aws.platform.upbound.io"
              apiVersion: "v1alpha1"
              singular: "XSQLInstance"
              plural: "xsqlinstances"
            - group: "azure.platform.upbound.io"
              apiVersion: "v1alpha1"
              singular: "XSQLInstance"
              plural: "xsqlinstances"
            - group: "azure.platform.upbound.io"
              apiVersion: "v1alpha1"
              singular: "XNetwork"
              plural: "xnetworks"
        crossplane:
          xrds:
            publishPhase:
              allowRepoSelection: false
              allowedTargets:
                - github.com
              target: github
              git:
                repoUrl: github.com?owner=upbound&repo=solution-idp
                targetBranch: siva-labs
    secretSync:
      - destRef:
          name: up-secret
          namespace: backstage
        sourceRef:
          name: solution-idp-non-prod-frontend-robot-token
          namespace: crossplane-system
      - destRef:
          name: github-pat
          namespace: backstage
        sourceRef:
          name: github-token
          namespace: crossplane-system       
    infrastructure:
      network:
        vpcCidrBlock: "192.168.0.0/16"
        subnets:
          - availabilityZone: eu-west-1a
            cidrBlock: 192.168.0.0/18
            type: public
          - availabilityZone: eu-west-1b
            cidrBlock: 192.168.64.0/18
            type: public
          - availabilityZone: eu-west-1a
            cidrBlock: 192.168.128.0/18
            type: private
          - availabilityZone: eu-west-1b
            cidrBlock: 192.168.192.0/18
            type: private
      ingressNginx:
        enabled: true
      certManager:
        enabled: true
      lbController:
        enabled: true
      externalDNS:
        enabled: true
        # backstage.upboundrocks.cloud
        route53ZoneId: "Z0253751120CQFDRYJ42R"
      eks:
        enabled: true
        accessConfig:
          bootstrapClusterCreatorAdminPermissions: true
          authenticationMode: API
        iam:
          principalArn: arn:aws:iam::222704912172:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_d716fac1f978e42c
        version: "1.31"
        nodes:
          count: 1
          instanceType: "m4.2xlarge"
